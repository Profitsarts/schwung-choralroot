name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write   # the release, and release.json on main
jobs:
  build:
    runs-on: ubuntu-24.04-arm   # native aarch64 = Move's CPU: no cross toolchain, no apt
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: ./scripts/test.sh
      - name: Check the tag matches module.json
        run: |
          for M in src/module.json pads/module.json; do
            V="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$M")"
            [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != $M $V"; exit 1; }
          done
      - name: Build
        run: |
          ./scripts/build.sh
          file dist/choralroot/dsp.so | grep -q 'ARM aarch64'
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/choralroot-module.tar.gz
            dist/choralroot-pads-module.tar.gz
      - name: Update release.json on main (what Schwung Manager reads)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git fetch origin main
          git checkout -f main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cat > release.json << EOF2
          {
            "version": "${VERSION}",
            "download_url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/choralroot-module.tar.gz",
            "modules": {
              "choralroot": {
                "version": "${VERSION}",
                "download_url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/choralroot-module.tar.gz"
              },
              "choralroot-pads": {
                "version": "${VERSION}",
                "download_url": "https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/choralroot-pads-module.tar.gz"
              }
            }
          }
          EOF2
          sed -i 's/^          //' release.json
          git add release.json
          git commit -m "chore: release.json for ${GITHUB_REF_NAME}" || echo "release.json unchanged"
          git push origin main
