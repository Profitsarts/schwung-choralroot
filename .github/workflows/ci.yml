name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: ./scripts/test.sh
      - name: Cross-compile for Move (aarch64)
        run: |
          APT='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=120'
          timeout 600 sudo apt-get $APT update -q
          timeout 600 sudo apt-get $APT install -y -q --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          ./scripts/build.sh
