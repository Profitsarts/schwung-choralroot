name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests
        run: ./scripts/test.sh
      - name: Cross-compile for Move (aarch64)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          ./scripts/build.sh
